name: mixdeck-digico
services:
  mixdeck-digico:
    image: ghcr.io/daviied/mixdeck-digico:latest
    container_name: mixdeck-digico
    restart: unless-stopped
    # Host networking lets "Find X32" broadcast on your LAN, and the DiGiCo reach port 7000.
    network_mode: host
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      X32_IP: ${X32_IP:-}
      X32_MOCK: ${X32_MOCK:-0}
      PORT: ${PORT:-8081}
    volumes:
      - /DATA/AppData/mixdeck-digico:/data
x-casaos:
  main: mixdeck-digico
  title:
    en_us: MixDeck DiGiCo
  description:
    en_us: X32 console control and follow mode, with channel meters from a DiGiCo.
  port_map: "8081"
  category: Utilities
